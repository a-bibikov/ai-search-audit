name: AI search audit
description: Check that ChatGPT, Claude and Perplexity can read, understand and cite your site (GEO, AI SEO, llms.txt)
author: Aleksandr Bibikov
branding:
  icon: search
  color: green
inputs:
  url:
    description: URL to audit, e.g. http://127.0.0.1:3000 for a build started in an earlier step
    required: true
  base:
    description: Public origin of the site when auditing a local build, e.g. https://example.com
    required: false
  fail-on:
    description: Fail the step on error (default), warn or never
    required: false
    default: error
  lang:
    description: Report language, en (default) or ru
    required: false
    default: en
  pages:
    description: Pages to audit, a number sampled across templates or "all" for every page in the sitemap
    required: false
    default: "20"
  max-pages:
    description: Old name of pages, kept for existing workflows; when set, it is used instead of pages
    required: false
  seo:
    description: Also run the classic SEO checks of search-auditor, in the same crawl and report (true or false)
    required: false
    default: "false"
  max-links:
    description: With seo, internal links to request
    required: false
    default: "100"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - shell: bash
      run: |
        args=("$URL" ${BASE:+--base "$BASE"} --fail-on "$FAIL_ON" --pages "${MAX_PAGES:-$PAGES}" --lang "$LANG_CODE")
        if [ "$SEO" = "true" ]; then
          # search-auditor is not a dependency of this package: it runs these AI checks and its SEO checks in one crawl.
          npx --yes --package "search-auditor@<1" search-auditor "${args[@]}" --max-links "$MAX_LINKS"
        else
          node "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}"
        fi
      env:
        URL: ${{ inputs.url }}
        BASE: ${{ inputs.base }}
        FAIL_ON: ${{ inputs.fail-on }}
        PAGES: ${{ inputs.pages }}
        MAX_PAGES: ${{ inputs.max-pages }}
        LANG_CODE: ${{ inputs.lang }}
        SEO: ${{ inputs.seo }}
        MAX_LINKS: ${{ inputs.max-links }}
